<style>
:root{--bg:#120a06;--bg2:#1c110b;--card:#241811;--card2:#170e09;--gold:#d9a441;--gold2:#f3d08a;--tx:#fbf1dc;--mut:#b9a58c;--line:rgba(217,164,65,.24);--nav:rgba(18,10,6,.9);--g1:#f3d08a;--g2:#d9a441;--h1:#fff;--sh:rgba(217,164,65,.35)}
[data-th=light]{--bg:#fbf6ee;--bg2:#f2e8d6;--card:#fff;--card2:#fdf8ef;--gold:#b9770e;--gold2:#8a4b1c;--tx:#2a1608;--mut:#6f5a45;--line:rgba(138,75,28,.2);--nav:rgba(251,246,238,.92);--g1:#efbf62;--g2:#d4922a;--h1:#2a1608;--sh:rgba(138,75,28,.25)}
*{box-sizing:border-box;margin:0;min-width:0}html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:16px/1.7 'Inter','Hind Siliguri',sans-serif;overflow-x:hidden;transition:background .3s}
body.bn{font-family:'Hind Siliguri','Inter',sans-serif}
h1,h2,h3{font-family:'Playfair Display','Hind Siliguri',serif;line-height:1.25;overflow-wrap:anywhere}
.bn h1,.bn h2,.bn h3{font-family:'Hind Siliguri',serif;font-weight:700}
a{color:inherit;text-decoration:none}img,video,iframe{max-width:100%}.w{max-width:1160px;margin:auto;padding:0 18px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav{position:fixed;inset:0 0 auto;z-index:50;padding:10px 0;transition:.3s}
nav.s{background:var(--nav);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;gap:18px}nav img{height:62px;width:62px;border-radius:50%;background:radial-gradient(circle,#fff8e8,#f3dfb4);padding:3px;box-shadow:0 4px 18px rgba(0,0,0,.28)}
nav .l{display:flex;gap:22px;font-size:14px;color:var(--mut);margin-left:auto}nav .l a:hover{color:var(--gold2)}
.act{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:99px;font:inherit;font-weight:600;border:1px solid var(--gold);cursor:pointer;transition:.3s;background:none;color:var(--tx);text-align:center}
.btn.g{background:linear-gradient(135deg,var(--g1),var(--g2));color:#2a1608;border-color:transparent;box-shadow:0 10px 36px -10px var(--sh)}
.btn:hover{transform:translateY(-3px)}.btn.sm{min-height:38px;padding:0 14px;font-size:13px}.btn.ic1{padding:0;width:38px}
.hero{min-height:100vh;display:flex;align-items:center;padding:110px 0 60px;background:radial-gradient(60% 50% at 75% 45%,var(--sh),transparent 70%),radial-gradient(40% 40% at 10% 90%,rgba(160,80,30,.2),transparent)}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.pill{display:inline-block;padding:6px 16px;border:1px solid var(--line);border-radius:99px;color:var(--gold2);font-size:13px;letter-spacing:.08em;margin-bottom:20px}
.hero h1{font-size:clamp(32px,5.4vw,66px);margin-bottom:18px;background:linear-gradient(120deg,var(--h1) 20%,var(--gold2) 65%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:18px;max-width:560px;margin-bottom:30px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px}.acts .btn{width:100%;padding:0 12px;font-size:15px}
.hpw{position:relative;width:min(400px,100%);margin:auto}.hpw:before{content:"";position:absolute;inset:16px -16px -16px 16px;border:1px solid var(--gold);border-radius:34px;opacity:.5}
.hp{position:relative;aspect-ratio:4/5;border-radius:32px;border:2px solid var(--gold);overflow:hidden;background:var(--bg2);display:grid;place-items:center;color:var(--gold);box-shadow:0 30px 80px -30px var(--sh)}
.hp img{width:100%;height:100%;object-fit:cover}.hp .i{width:80px;height:80px;stroke-width:1}
.mq{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:15px 0;color:var(--gold2);font-size:19px;background:var(--bg2)}
.mq div{display:inline-block;animation:mq 30s linear infinite}.mq span{margin:0 26px}@keyframes mq{to{transform:translateX(-50%)}}
section{padding:84px 0;scroll-margin-top:60px}.alt{background:var(--bg2)}
.hd{text-align:center;margin-bottom:48px}.hd small{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:600}.hd h2{font-size:clamp(26px,4vw,44px);margin-top:8px}.hd p{color:var(--mut);max-width:680px;margin:12px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:22px}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:24px;padding:28px;transition:.4s}
.card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 24px 60px -24px var(--sh)}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sh),transparent);border:1px solid var(--line);color:var(--gold2);margin-bottom:16px}
.card h3{font-size:21px;margin-bottom:8px}.card p{color:var(--mut);font-size:15px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.st .card{text-align:center;padding:26px 18px}.st .ic{margin:0 auto 12px}.st h3{font-size:38px;color:var(--gold2);line-height:1.1}.st b{display:block;font-weight:600;margin-top:6px}.st p{font-size:14px}
.cbox{margin-top:36px;text-align:center;padding:44px 24px;border-radius:32px;border:1px solid var(--gold);background:radial-gradient(70% 120% at 50% 0,var(--sh),transparent),var(--card)}
.cbox h2{font-size:clamp(24px,3.6vw,40px);margin-bottom:22px}.cbox .btn{padding:0 34px}
.crs{max-width:520px;margin:auto;position:relative;border-color:var(--gold)}
.off{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#2a1608;border-radius:99px;padding:5px 14px;font-weight:700;font-size:13px;margin-bottom:16px}
.dur{display:flex;gap:10px;align-items:center;color:var(--gold2);font-weight:600;margin:14px 0}
.pr{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:18px}.pr s{color:var(--mut);font-size:18px}.pr b{font-size:34px;color:var(--gold2)}
.ck{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px}.ck li{display:flex;gap:10px;align-items:flex-start}.ck .i{color:var(--gold);width:20px;height:20px;margin-top:3px}
.tr{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.tp{aspect-ratio:4/5;border-radius:28px;border:2px solid var(--gold);overflow:hidden;background:var(--bg2);display:grid;place-items:center;color:var(--gold);box-shadow:0 30px 70px -30px var(--sh)}
.tp img{width:100%;height:100%;object-fit:cover}.tp .i{width:90px;height:90px;stroke-width:1}
.tr h3{font-size:30px}.tr .rl{color:var(--gold);font-weight:600;margin:4px 0 16px}.tr p{color:var(--mut);margin-bottom:12px}.tr .ck{margin:18px 0 26px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin:auto}
.sg div{aspect-ratio:4/5;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--gold);transition:.4s}
.sg div:hover{transform:scale(1.03);border-color:var(--gold)}.sg img{width:100%;height:100%;object-fit:cover}
.lm{display:inline-flex;gap:8px;align-items:center;margin-top:14px;color:var(--gold);font-weight:600;font-size:14px}.lm .i{width:16px;height:16px}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:22px}
.vb{padding:14px 14px 22px;overflow:hidden}.vb h3{margin:16px 8px 4px;font-size:20px}.vb p{margin:0 8px}
.vd{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--bg2);display:grid;place-items:center;color:var(--gold)}.vd iframe,.vd video{width:100%;height:100%;border:0}.vd .i{width:56px;height:56px}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:30px}.ct .r{display:flex;gap:16px;margin-bottom:20px;align-items:flex-start}.ct .r .ic{margin:0;flex:none}
footer{padding:30px 0;text-align:center;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));color:#2a1608;box-shadow:0 10px 36px var(--sh)}
.rev{opacity:0;transform:translateY(34px);transition:.9s cubic-bezier(.2,.8,.2,1)}.rev.on{opacity:1;transform:none}
@media(max-width:860px){.st{grid-template-columns:repeat(2,1fr)}.hero .w,.ct,.tr{grid-template-columns:1fr}.tr{gap:28px}nav .l{display:none}.act{margin-left:auto}.hpw{order:-1;width:min(290px,70vw)}.hero{padding-top:96px;text-align:center}.hero p{margin-inline:auto}.acts{margin:auto}section{padding:60px 0}.tp{max-width:340px;margin:auto;width:100%}}
@media(max-width:560px){.st{gap:12px}.st .card{padding:18px 8px}.st h3{font-size:30px}.st b{font-size:14px}.st .ic{width:46px;height:46px;margin-bottom:8px}.acts{grid-template-columns:1fr}.sg{gap:8px}.sg div{border-radius:14px}.card{padding:22px}.cbox{padding:34px 18px;border-radius:24px}nav img{height:54px;width:54px}}

<script>
let D,L=localStorage.lang||'bn';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=o=>esc(o&&typeof o==='object'?(o[L]||o.bn||o.en||''):(o||''));
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const hd=(k,h,p)=>`<div class="hd rev"><small>${t(k)}</small><h2>${t(h)}</h2>${t(p)?`<p>${t(p)}</p>`:''}</div>`;
const enr=`<a class="btn g enr" target="_blank" rel="noopener">${ic('wa')}<span data-k="Enroll Now|এখনই ভর্তি হোন"></span></a>`;
const ck=a=>`<ul class="ck">${(a||[]).map(x=>`<li>${ic('check')}<span>${t(x)}</span></li>`).join('')}</ul>`;
function vid(s){s=String(s||'');const m=s.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);
 if(m)return`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" loading="lazy" allowfullscreen title="video" allow="encrypted-media;picture-in-picture"></iframe>`;
 if(/\.(mp4|webm|mov)$/i.test(s))return`<video src="${esc(s)}" controls preload="metadata"></video>`;return ic('play')}
function paint(){
 document.body.className=L;document.documentElement.lang=L;$('#lang').textContent=L=='bn'?'EN':'বাং';
 $('#th').innerHTML=ic(document.documentElement.dataset.th=='dark'?'sun':'moon');
 if(D){const s=D.site;
 $('#pill').textContent=t(s.name).replace(/&amp;/g,'&');$('#ht').innerHTML=t(s.hero_title);$('#hs').innerHTML=t(s.hero_sub);$('#vf').href=s.verify;$('#hp').innerHTML=`<div class="hp">${s.hero_photo?`<img src="${esc(s.hero_photo)}" alt="">`:ic('img')}</div>`;
 $('#mq').innerHTML=[0,1].map(()=>(D.marquee||[]).map(m=>`<span>${t(m)}</span><span>&#9679;</span>`).join('')).join('');
 $('#st').innerHTML=(D.stats||[]).map((x,i)=>`<div class="card">${'<div class="ic">'+ic(['users','cup','briefcase','star'][i%4])+'</div>'}<h3>${esc(x.n)}</h3><b>${t(x.label)}</b><p>${t(x.sub)}</p></div>`).join('');
 $('#c1').innerHTML=t(D.cta.top);$('#c2').innerHTML=t(D.cta.bottom);
 $('#cg').innerHTML=(D.courses||[]).map(c=>`<div class="card crs rev">${t(c.badge)?`<span class="off">${t(c.badge)}</span>`:''}<h3>${t(c.title)}</h3><p>${t(c.desc)}</p><div class="dur">${ic('clock')}${t(c.duration)}</div><div class="pr">${c.old?`<s>${esc(c.old)}</s>`:''}<b>${esc(c.price)}</b></div>${ck(c.features)}${enr}</div>`).join('');
 const r=D.trainer;$('#tr').innerHTML=hd(r.kicker,r.title,r.sub)+`<div class="tr rev"><div class="tp">${r.photo?`<img src="${esc(r.photo)}" alt="">`:ic('user')}</div><div><h3>${t(r.name)}</h3><div class="rl">${t(r.role)}</div><p>${t(r.bio)}</p><p>${t(r.bio2)}</p>${ck(r.points)}${enr}</div></div>`;
 const u=D.success;$('#sc').innerHTML=hd(u.kicker,u.title,u.sub)+`<div class="sg rev">${[0,1,2,3,4,5].map(i=>`<div>${(u.photos||[])[i]?`<img src="${esc(u.photos[i])}" loading="lazy" alt="">`:ic('img')}</div>`).join('')}</div>`;
 const y=D.why;$('#wy').innerHTML=hd(y.kicker,y.title,y.sub)+`<div class="grid">${(y.items||[]).map((x,i)=>`<div class="card rev"><div class="ic">${ic(['hand','machine','award','briefcase'][i%4])}</div><h3>${t(x.title)}</h3><p>${t(x.desc)}</p><a class="lm" href="#contact">${L=='bn'?'আরও জানুন':'Learn More'}${ic('arrow')}</a></div>`).join('')}</div>`;
 const v=D.stories;$('#sr').innerHTML=hd(v.kicker,v.title,v.sub)+`<div class="vg">${(v.videos||[]).map(x=>`<div class="card vb rev"><div class="vd">${vid(x.video)}</div><h3>${t(x.title)}</h3><p>${t(x.sub)}</p></div>`).join('')}</div>`;
 $('#kg').innerHTML=(D.career||[]).map((x,i)=>`<div class="card rev"><div class="ic">${ic(['globe','award','users','cup'][i%4])}</div><h3>${t(x.title)}</h3><p>${t(x.desc)}</p></div>`).join('');
 const row=(i,h,b)=>`<div class="r"><div class="ic">${ic(i)}</div><div><h3 style="font-size:18px">${h}</h3>${b}</div></div>`;
 $('#ct').innerHTML=`<div>${row('phone',L=='bn'?'ফোন':'Phone',s.phones.map(p=>`<a href="tel:${p.replace(/\D/g,'')}" style="display:block;color:var(--mut)">${esc(p)}</a>`).join(''))}${row('pin',L=='bn'?'ঠিকানা':'Address',`<p style="color:var(--mut)">${t(s.address)}</p>`)}${row('fb','Facebook',`<a href="${esc(s.facebook)}" target="_blank" rel="noopener" style="color:var(--gold2)">facebook.com/ahlanqahwabd</a>`)}${t(s.hours)?row('clock',L=='bn'?'সময়':'Hours',`<p style="color:var(--mut)">${t(s.hours)}</p>`):''}</div><div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="ic" style="margin:0 auto 16px">${ic('pin')}</div><a class="btn g" target="_blank" rel="noopener" href="${esc(s.map)}">${L=='bn'?'ম্যাপে দেখুন':'Open in Maps'}${ic('arrow')}</a></div></div>`;
 $('#ft').textContent='© '+new Date().getFullYear()+' '+t(s.name).replace(/&amp;/g,'&');
 const wa='https://wa.me/'+s.whatsapp+'?text='+encodeURIComponent(L=='bn'?'আসসালামু আলাইকুম, আমি বারিস্তা কোর্সে ভর্তি হতে চাই।':'Hello, I would like to join the barista course.');
 document.querySelectorAll('.enr').forEach(a=>a.href=wa)}
 document.querySelectorAll('[data-k]').forEach(e=>e.textContent=e.dataset.k.split('|')[L=='bn'?1:0]);io()}
function io(){const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&(x.target.classList.add('on'),o.unobserve(x.target))),{threshold:.1});document.querySelectorAll('.rev:not(.on)').forEach(e=>o.observe(e))}
$('#lang').onclick=()=>{L=L=='bn'?'en':'bn';localStorage.lang=L;paint()};
$('#th').onclick=()=>{const d=document.documentElement,n=d.dataset.th=='dark'?'light':'dark';d.dataset.th=n;localStorage.th=n;paint()};
addEventListener('scroll',()=>$('#nav').classList.toggle('s',scrollY>40));
paint();
fetch('content.json?v='+Date.now()).then(r=>r.json()).then(j=>{D=j;paint()}).catch(()=>{$('#ht').textContent='content.json load hoyni. GitHub Pages e open korun.'});
